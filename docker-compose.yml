version: "3.8"

# Local development infrastructure. The app uses MySQL (see prisma/schema.prisma
# — provider = "mysql"), so this brings up MySQL 8 plus the supporting services.
# Point .env at it, e.g.:
#   DATABASE_URL="mysql://root:root@localhost:3306/executive_ai_db"

services:
  mysql:
    image: mysql:8.0
    container_name: executive_ai_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: executive_ai_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: executive_ai_redis
    restart: always
    ports:
      - "6375:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: executive_ai_qdrant
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
